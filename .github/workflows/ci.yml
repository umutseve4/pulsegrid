name: Core Reliability CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Prove M1 and M2 fail-closed invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run executable invariant tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
